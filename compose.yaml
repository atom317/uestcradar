services:
  # Each Sidecar owns both RingBuffers and runs telemetry in-process.
  sidecar-alpha:
    container_name: sidecar-alpha
    build:
      context: .
      dockerfile: docker/Dockerfile.sidecar
      args:
        BASE_IMAGE: ${BASE_IMAGE:-registry.chengyistudio.com/cxx/ubuntu:24.04}
    image: ${SIDECAR_IMAGE:-registry.chengyistudio.com/cxx/ring-sidecar:0.1.0}
    ipc: shareable
    shm_size: ${ALPHA_SHM_SIZE:-64m}
    init: true
    environment:
      NODE_ID: Radar-Alpha
      RING_CAPACITY_BYTES: ${ALPHA_RING_CAPACITY_BYTES:-8388608}
      TELEMETRY_HOST: ${TELEMETRY_HOST:-telemetry-web}
      TELEMETRY_PORT: ${TELEMETRY_PORT:-9900}
      SAMPLE_INTERVAL: ${SAMPLE_INTERVAL:-100}
    depends_on:
      - telemetry-web

  mock-worker-alpha:
    container_name: mock-worker-alpha
    build:
      context: .
      dockerfile: docker/Dockerfile.mock-worker
      args:
        BASE_IMAGE: ${BASE_IMAGE:-registry.chengyistudio.com/cxx/ubuntu:24.04}
    image: ${MOCK_WORKER_IMAGE:-registry.chengyistudio.com/cxx/ring-mock-worker:0.1.0}
    ipc: service:sidecar-alpha
    init: true
    depends_on:
      - sidecar-alpha

  sidecar-beta:
    container_name: sidecar-beta
    build:
      context: .
      dockerfile: docker/Dockerfile.sidecar
      args:
        BASE_IMAGE: ${BASE_IMAGE:-registry.chengyistudio.com/cxx/ubuntu:24.04}
    image: ${SIDECAR_IMAGE:-registry.chengyistudio.com/cxx/ring-sidecar:0.1.0}
    ipc: shareable
    shm_size: ${BETA_SHM_SIZE:-64m}
    init: true
    environment:
      NODE_ID: Radar-Beta
      RING_CAPACITY_BYTES: ${BETA_RING_CAPACITY_BYTES:-8388608}
      TELEMETRY_HOST: ${TELEMETRY_HOST:-telemetry-web}
      TELEMETRY_PORT: ${TELEMETRY_PORT:-9900}
      SAMPLE_INTERVAL: ${SAMPLE_INTERVAL:-100}
    depends_on:
      - telemetry-web

  mock-worker-beta:
    container_name: mock-worker-beta
    build:
      context: .
      dockerfile: docker/Dockerfile.mock-worker
      args:
        BASE_IMAGE: ${BASE_IMAGE:-registry.chengyistudio.com/cxx/ubuntu:24.04}
    image: ${MOCK_WORKER_IMAGE:-registry.chengyistudio.com/cxx/ring-mock-worker:0.1.0}
    ipc: service:sidecar-beta
    init: true
    depends_on:
      - sidecar-beta

  telemetry-web:
    container_name: telemetry-web
    build:
      context: .
      dockerfile: workspace/web/Dockerfile
    image: ${TELEMETRY_IMAGE:-uestcradar-telemetry:0.1.0}
    ports:
      - "8080:8080"
      - "9900:9900/udp"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.50
