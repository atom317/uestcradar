services:
  sidecar:
    container_name: ring-sidecar
    build:
      context: .
      dockerfile: docker/Dockerfile.sidecar
      args:
        BASE_IMAGE: registry.chengyistudio.com/cxx/ubuntu:24.04
    image: ${SIDECAR_IMAGE:-registry.chengyistudio.com/cxx/ring-sidecar:0.1.0}
    ipc: shareable
    shm_size: 64m
    init: true
    environment:
      NODE_ID: ${NODE_ID:-local}
      TELEMETRY_HOST: ${TELEMETRY_HOST:-telemetry-web}
      TELEMETRY_PORT: ${TELEMETRY_PORT:-9900}
      SAMPLE_INTERVAL: ${SAMPLE_INTERVAL:-100}

  worker:
    container_name: ring-worker
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
      args:
        BASE_IMAGE: registry.chengyistudio.com/cxx/ubuntu:24.04
    image: ${WORKER_IMAGE:-registry.chengyistudio.com/cxx/ring-worker:0.1.0}
    ipc: service:sidecar
    depends_on:
      - sidecar
    init: true

  telemetry-web:
    container_name: telemetry-web
    build:
      context: .
      dockerfile: workspace/web/Dockerfile
    image: ${TELEMETRY_IMAGE:-uestcradar-telemetry:0.1.0}
    ports:
      - "8080:8080"
      - "9900:9900/udp"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.50
