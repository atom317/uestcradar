services:
  sidecar-test:
    container_name: sidecar-forwarder-test
    build:
      context: ../../..
      dockerfile: workspace/sidecar/Dockerfile
      target: runtime
      args:
        BASE_IMAGE: ${BASE_IMAGE:-registry.chengyistudio.com/cxx/ubuntu:24.04}
    image: ${SIDECAR_IMAGE:-uestcradar-sidecar:forwarder-test}
    network_mode: host
    ipc: shareable
    shm_size: ${SIDECAR_SHM_SIZE:-64m}
    init: true
    environment:
      NODE_ID: Forwarder-Test
      SIDECAR_UPSTREAM_SLOT_COUNT: ${SLOT_COUNT:-64}
      SIDECAR_UPSTREAM_MAX_PAYLOAD_BYTES: ${MAX_PAYLOAD_BYTES:-262144}
      SIDECAR_UPSTREAM_TYPE_ID: "1"
      SIDECAR_UPSTREAM_TYPE_VERSION: "1"
      SIDECAR_DOWNSTREAM_SLOT_COUNT: ${SLOT_COUNT:-64}
      SIDECAR_DOWNSTREAM_MAX_PAYLOAD_BYTES: ${MAX_PAYLOAD_BYTES:-262144}
      SIDECAR_DOWNSTREAM_TYPE_ID: "1"
      SIDECAR_DOWNSTREAM_TYPE_VERSION: "1"
      SIDECAR_UCX_ROLE: listen
      SIDECAR_UCX_BIND_HOST: 0.0.0.0
      SIDECAR_UCX_PORT: ${SIDECAR_UCX_PORT:-13337}
      SIDECAR_UCX_DATA_PATH: functional
      UCX_TLS: tcp,self
      TELEMETRY_HOST: 127.0.0.1
      TELEMETRY_PORT: "9900"
      SAMPLE_INTERVAL: "100"
    depends_on:
      - telemetry-test

  worker-test:
    container_name: worker-forwarder-test
    build:
      context: ../../..
      dockerfile: workspace/sidecar/Dockerfile
      target: e2e-benchmark
      args:
        BASE_IMAGE: ${BASE_IMAGE:-registry.chengyistudio.com/cxx/ubuntu:24.04}
    image: ${WORKER_IMAGE:-uestcradar-worker:forwarder-test}
    network_mode: host
    ipc: service:sidecar-test
    init: true
    environment:
      UESTCRADAR_UPSTREAM_SHM_NAME: /uestcradar_upstream
      UESTCRADAR_DOWNSTREAM_SHM_NAME: /uestcradar_downstream
    command:
      - --mode
      - producer
      - --payload-bytes
      - ${PAYLOAD_BYTES:-65536}
      - --duration-seconds
      - ${DURATION_SECONDS:-10}
    depends_on:
      - sidecar-test

  telemetry-test:
    container_name: telemetry-forwarder-test
    build:
      context: ../../..
      dockerfile: workspace/web/Dockerfile
    image: ${TELEMETRY_IMAGE:-uestcradar-telemetry:forwarder-test}
    network_mode: host
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
