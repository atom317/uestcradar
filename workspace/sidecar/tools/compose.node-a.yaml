services:
  sidecar-a:
    build:
      context: ../../..
      dockerfile: workspace/sidecar/Dockerfile
      target: runtime
      args:
        BASE_IMAGE: ${BASE_IMAGE:-registry.chengyistudio.com/cxx/algo-base:latest}
    image: ${SIDECAR_IMAGE:-uestcradar-sidecar:slot-e2e}
    network_mode: host
    ipc: shareable
    shm_size: ${SIDECAR_SHM_SIZE:-128m}
    init: true
    environment:
      NODE_ID: node-a
      SIDECAR_UPSTREAM_SHM_NAME: /uestcradar_node_a_upstream
      SIDECAR_DOWNSTREAM_SHM_NAME: /uestcradar_node_a_downstream
      SIDECAR_UCX_ROLE: listen
      SIDECAR_UCX_BIND_HOST: 0.0.0.0
      SIDECAR_UCX_PORT: ${SIDECAR_UCX_PORT:-13337}
      SIDECAR_UCX_CONNECT_TIMEOUT_MS: "1000"
      SIDECAR_UCX_DATA_PATH: ${SIDECAR_UCX_DATA_PATH:-functional}
      SIDECAR_UPSTREAM_SLOT_COUNT: ${SLOT_COUNT:-64}
      SIDECAR_UPSTREAM_MAX_PAYLOAD_BYTES: ${MAX_PAYLOAD_BYTES:-262144}
      SIDECAR_UPSTREAM_TYPE_ID: "1"
      SIDECAR_UPSTREAM_TYPE_VERSION: "1"
      SIDECAR_DOWNSTREAM_SLOT_COUNT: ${SLOT_COUNT:-64}
      SIDECAR_DOWNSTREAM_MAX_PAYLOAD_BYTES: ${MAX_PAYLOAD_BYTES:-262144}
      SIDECAR_DOWNSTREAM_TYPE_ID: "1"
      SIDECAR_DOWNSTREAM_TYPE_VERSION: "1"
      UCX_TLS: ${UCX_TLS:-tcp,self}
      TELEMETRY_HOST: 127.0.0.1

  worker-a:
    build:
      context: ../../..
      dockerfile: workspace/sidecar/Dockerfile
      target: e2e-benchmark
      args:
        BASE_IMAGE: ${BASE_IMAGE:-registry.chengyistudio.com/cxx/algo-base:latest}
    image: ${E2E_IMAGE:-uestcradar-e2e-benchmark:slot}
    network_mode: host
    ipc: service:sidecar-a
    init: true
    environment:
      UESTCRADAR_UPSTREAM_SHM_NAME: /uestcradar_node_a_upstream
      UESTCRADAR_DOWNSTREAM_SHM_NAME: /uestcradar_node_a_downstream
    entrypoint: ["/app/e2e-benchmark"]
    command:
      - --mode
      - producer
      - --payload-bytes
      - ${PAYLOAD_BYTES:-65536}
      - --warmup-seconds
      - ${WARMUP_SECONDS:-2}
      - --duration-seconds
      - ${DURATION_SECONDS:-3600}
      - --rate-mib-s
      - ${RATE_MIB_S:-0}
      - --wave-period-seconds
      - ${WAVE_PERIOD_SECONDS:-4}
    depends_on:
      - sidecar-a
