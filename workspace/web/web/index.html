<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CyComm Node Control</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
      --background: #071017;
      --panel: rgba(13, 27, 37, 0.92);
      --panel-raised: #10222e;
      --line: #25404d;
      --line-soft: rgba(100, 148, 166, 0.18);
      --text: #e9f4f7;
      --muted: #7f9aa6;
      --cyan: #34d9df;
      --green: #52e39b;
      --amber: #ffb84d;
      --red: #ff5f68;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 80% -10%, rgba(52, 217, 223, 0.12), transparent 34rem),
        radial-gradient(circle at 5% 45%, rgba(34, 97, 122, 0.12), transparent 28rem),
        var(--background);
    }

    body::before {
      position: fixed;
      inset: 0;
      z-index: -1;
      content: "";
      opacity: 0.24;
      background-image:
        linear-gradient(rgba(66, 116, 133, 0.09) 1px, transparent 1px),
        linear-gradient(90deg, rgba(66, 116, 133, 0.09) 1px, transparent 1px);
      background-size: 32px 32px;
      mask-image: linear-gradient(to bottom, black, transparent 85%);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 17px clamp(18px, 4vw, 48px);
      border-bottom: 1px solid var(--line-soft);
      background: rgba(5, 14, 20, 0.88);
      backdrop-filter: blur(16px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
      min-width: max-content;
    }

    .brand-mark {
      position: relative;
      width: 35px;
      height: 35px;
      border: 1px solid rgba(52, 217, 223, 0.65);
      border-radius: 8px;
      box-shadow: inset 0 0 14px rgba(52, 217, 223, 0.12);
    }

    .brand-mark::before,
    .brand-mark::after {
      position: absolute;
      content: "";
      background: var(--cyan);
      box-shadow: 0 0 9px rgba(52, 217, 223, 0.75);
    }

    .brand-mark::before {
      top: 8px;
      bottom: 8px;
      left: 16px;
      width: 2px;
    }

    .brand-mark::after {
      top: 16px;
      right: 8px;
      left: 8px;
      height: 2px;
    }

    .brand h1 {
      margin: 0;
      font: 700 16px/1.1 ui-monospace, SFMono-Regular, Consolas, monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .brand small {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font: 10px/1 ui-monospace, SFMono-Regular, Consolas, monospace;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .summary {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 9px;
      flex-wrap: wrap;
    }

    .summary-item {
      display: flex;
      align-items: baseline;
      gap: 7px;
      min-width: 72px;
      padding: 7px 10px;
      border: 1px solid var(--line-soft);
      border-radius: 6px;
      background: rgba(16, 34, 46, 0.6);
    }

    .summary-item span {
      color: var(--muted);
      font: 10px ui-monospace, SFMono-Regular, Consolas, monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .summary-item strong {
      margin-left: auto;
      font: 700 15px ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    .summary-item.online strong { color: var(--green); }
    .summary-item.offline strong { color: var(--red); }

    .layout {
      width: min(1600px, 100%);
      margin: 0 auto;
      padding: 30px clamp(18px, 4vw, 48px) 48px;
    }

    .section-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
    }

    .eyebrow {
      margin: 0 0 7px;
      color: var(--cyan);
      font: 10px ui-monospace, SFMono-Regular, Consolas, monospace;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .section-head h2 {
      margin: 0;
      font-size: clamp(20px, 3vw, 28px);
      letter-spacing: -0.025em;
    }

    #connection {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font: 11px ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    #connection::before {
      width: 7px;
      height: 7px;
      content: "";
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 9px rgba(82, 227, 155, 0.75);
    }

    #connection.error::before {
      background: var(--red);
      box-shadow: 0 0 9px rgba(255, 95, 104, 0.7);
    }

    .node-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 480px), 1fr));
      gap: 18px;
    }

    .node-card {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(52, 217, 223, 0.32);
      border-radius: 12px;
      background: linear-gradient(145deg, rgba(16, 34, 46, 0.96), rgba(8, 20, 29, 0.96));
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.2), inset 0 1px rgba(255, 255, 255, 0.025);
    }

    .node-card::before {
      position: absolute;
      top: 0;
      left: 0;
      width: 92px;
      height: 2px;
      content: "";
      background: var(--cyan);
      box-shadow: 0 0 12px rgba(52, 217, 223, 0.85);
    }

    .node-card.offline {
      border-color: rgba(255, 95, 104, 0.32);
      filter: saturate(0.45);
    }

    .node-card.offline::before {
      background: var(--red);
      box-shadow: 0 0 12px rgba(255, 95, 104, 0.65);
    }

    .node-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 17px 18px;
      border-bottom: 1px solid var(--line-soft);
    }

    .node-title {
      min-width: 0;
    }

    .node-title h3 {
      overflow: hidden;
      margin: 0;
      font: 700 16px ui-monospace, SFMono-Regular, Consolas, monospace;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .node-title p {
      margin: 5px 0 0;
      color: var(--muted);
      font: 10px ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    .lease {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 9px;
      border: 1px solid rgba(82, 227, 155, 0.28);
      border-radius: 999px;
      color: var(--green);
      background: rgba(82, 227, 155, 0.07);
      font: 700 9px ui-monospace, SFMono-Regular, Consolas, monospace;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .lease::before {
      width: 6px;
      height: 6px;
      content: "";
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 7px currentColor;
    }

    .offline .lease {
      border-color: rgba(255, 95, 104, 0.32);
      color: var(--red);
      background: rgba(255, 95, 104, 0.07);
    }

    .links {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      padding: 14px;
    }

    .buffer {
      min-width: 0;
      padding: 13px;
      border: 1px solid var(--line-soft);
      border-radius: 8px;
      background: rgba(5, 15, 22, 0.72);
    }

    .buffer.missing {
      display: grid;
      min-height: 174px;
      place-items: center;
      border-style: dashed;
      color: #58717c;
      font: 10px ui-monospace, SFMono-Regular, Consolas, monospace;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .buffer-head,
    .water-label,
    .buffer-stats {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .buffer-name {
      overflow: hidden;
      color: #b6cbd3;
      font: 700 10px ui-monospace, SFMono-Regular, Consolas, monospace;
      letter-spacing: 0.1em;
      text-overflow: ellipsis;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .direction {
      color: #55717d;
      font: 9px ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    .shutdown {
      color: var(--red);
      font: 700 9px ui-monospace, SFMono-Regular, Consolas, monospace;
      letter-spacing: 0.08em;
    }

    .water-label {
      align-items: flex-end;
      margin: 18px 0 8px;
    }

    .water-label strong {
      color: var(--cyan);
      font: 700 29px/1 ui-monospace, SFMono-Regular, Consolas, monospace;
      letter-spacing: -0.06em;
    }

    .water-label span {
      color: var(--muted);
      font: 10px ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    .water-track {
      position: relative;
      overflow: hidden;
      height: 20px;
      border: 1px solid #2c4a57;
      border-radius: 4px;
      background: #08151d;
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.45);
    }

    .water-fill {
      height: 100%;
      background: linear-gradient(90deg, #159aa3, var(--cyan));
      box-shadow: 0 0 13px rgba(52, 217, 223, 0.4);
      transition: width 180ms ease;
    }

    .water-track::after {
      position: absolute;
      inset: 0;
      content: "";
      background: repeating-linear-gradient(
        90deg,
        transparent 0,
        transparent calc(10% - 1px),
        rgba(4, 12, 17, 0.72) calc(10% - 1px),
        rgba(4, 12, 17, 0.72) 10%
      );
    }

    .buffer.warning .water-label strong { color: var(--amber); }
    .buffer.warning .water-fill {
      background: linear-gradient(90deg, #ce7d25, var(--amber));
      box-shadow: 0 0 13px rgba(255, 184, 77, 0.42);
    }

    .buffer.critical .water-label strong { color: var(--red); }
    .buffer.critical .water-fill {
      background: linear-gradient(90deg, #c83e49, var(--red));
      box-shadow: 0 0 13px rgba(255, 95, 104, 0.5);
    }

    .offline .water-fill {
      background: #60737a;
      box-shadow: none;
    }

    .offline .water-label strong { color: #91a2a8; }

    .buffer-stats {
      margin-top: 12px;
      color: #65808b;
      font: 9px ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    .buffer-stats b {
      display: block;
      margin-top: 3px;
      color: #a8bec7;
      font-size: 10px;
      font-weight: 500;
    }

    .empty {
      grid-column: 1 / -1;
      padding: 64px 24px;
      border: 1px dashed var(--line);
      border-radius: 12px;
      color: var(--muted);
      text-align: center;
      background: rgba(8, 20, 29, 0.5);
    }

    .empty strong {
      display: block;
      margin-bottom: 8px;
      color: #b7cbd3;
      font: 600 14px ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    footer {
      margin-top: 20px;
      color: #536d78;
      font: 9px ui-monospace, SFMono-Regular, Consolas, monospace;
      letter-spacing: 0.1em;
      text-align: right;
      text-transform: uppercase;
    }

    @media (max-width: 780px) {
      .topbar,
      .section-head {
        align-items: flex-start;
        flex-direction: column;
      }

      .summary { justify-content: flex-start; }
      .links { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      .water-fill { transition: none; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <h1>CyComm Node Control</h1>
        <small>Sidecar telemetry matrix</small>
      </div>
    </div>
    <div class="summary" aria-label="节点状态汇总">
      <div class="summary-item"><span>Nodes</span><strong id="total-count">0</strong></div>
      <div class="summary-item online"><span>Online</span><strong id="online-count">0</strong></div>
      <div class="summary-item offline"><span>Offline</span><strong id="offline-count">0</strong></div>
    </div>
  </header>

  <main class="layout">
    <div class="section-head">
      <div>
        <p class="eyebrow">Live infrastructure</p>
        <h2>物理节点与缓冲区水位</h2>
      </div>
      <div id="connection">等待遥测数据</div>
    </div>
    <section id="nodes" class="node-grid" aria-live="polite">
      <div class="empty">
        <strong>NO NODES REGISTERED</strong>
        等待 Sidecar UDP 心跳…
      </div>
    </section>
    <footer>Lease TTL 3s · Registry scan 500ms · Browser refresh 250ms</footer>
  </main>

  <script>
    const nodesElement = document.querySelector("#nodes");
    const connectionElement = document.querySelector("#connection");
    const totalCount = document.querySelector("#total-count");
    const onlineCount = document.querySelector("#online-count");
    const offlineCount = document.querySelector("#offline-count");
    let refreshing = false;

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[character]);
    }

    function formatBytes(value) {
      const units = ["B", "KiB", "MiB", "GiB", "TiB"];
      let amount = Number(value) || 0;
      let unit = 0;
      while (amount >= 1024 && unit < units.length - 1) {
        amount /= 1024;
        unit++;
      }
      return `${amount.toFixed(unit === 0 ? 0 : 1)} ${units[unit]}`;
    }

    function formatAge(value) {
      const milliseconds = Date.now() - Date.parse(value);
      if (!Number.isFinite(milliseconds)) return "unknown";
      if (milliseconds < 1000) return "just now";
      if (milliseconds < 60000) return `${(milliseconds / 1000).toFixed(1)}s ago`;
      return `${Math.floor(milliseconds / 60000)}m ago`;
    }

    function orderedLinks(links) {
      const byID = new Map(links.map(link => [link.link_id, link]));
      const result = [
        byID.get("upstream") || {link_id: "upstream", points: [], missing: true},
        byID.get("downstream") || {link_id: "downstream", points: [], missing: true}
      ];
      const extras = links
        .filter(link => link.link_id !== "upstream" && link.link_id !== "downstream")
        .sort((left, right) => left.link_id.localeCompare(right.link_id));
      return result.concat(extras);
    }

    function renderBuffer(link) {
      if (link.missing || !link.points.length) {
        return `<section class="buffer missing">${escapeHTML(link.link_id)} · unavailable</section>`;
      }

      const latest = link.points[link.points.length - 1];
      const capacity = Number(latest.capacity_bytes) || 0;
      const used = Number(latest.used_bytes) || 0;
      const rawPercentage = capacity > 0 ? used / capacity * 100 : 0;
      const percentage = Math.max(0, Math.min(100, rawPercentage));
      const tone = latest.shutdown || rawPercentage > 95
        ? "critical"
        : rawPercentage > 80
          ? "warning"
          : "healthy";
      const direction = link.link_id === "upstream"
        ? "RX / INPUT"
        : link.link_id === "downstream"
          ? "TX / OUTPUT"
          : "DYNAMIC LINK";

      return `
        <section class="buffer ${tone}">
          <div class="buffer-head">
            <span class="buffer-name">${escapeHTML(link.link_id)}</span>
            ${latest.shutdown
              ? '<span class="shutdown">● SHUTDOWN</span>'
              : `<span class="direction">${direction}</span>`}
          </div>
          <div class="water-label">
            <strong>${rawPercentage.toFixed(1)}%</strong>
            <span>${formatBytes(used)} / ${formatBytes(capacity)}</span>
          </div>
          <div class="water-track"
               role="progressbar"
               aria-label="${escapeHTML(link.link_id)} 使用率"
               aria-valuemin="0"
               aria-valuemax="100"
               aria-valuenow="${percentage.toFixed(1)}">
            <div class="water-fill" style="width:${percentage.toFixed(2)}%"></div>
          </div>
          <div class="buffer-stats">
            <span>WRITE<b>${latest.write_position}</b></span>
            <span>READ<b>${latest.read_position}</b></span>
            <span>SEQ<b>${latest.sequence}</b></span>
          </div>
        </section>`;
    }

    function renderNode(node) {
      const online = node.status === "online";
      return `
        <article class="node-card ${online ? "" : "offline"}">
          <header class="node-head">
            <div class="node-title">
              <h3>${escapeHTML(node.node_id)}</h3>
              <p>LAST SEEN · ${formatAge(node.last_seen)}</p>
            </div>
            <span class="lease">${online ? "Online" : "Offline"}</span>
          </header>
          <div class="links">
            ${orderedLinks(node.links || []).map(renderBuffer).join("")}
          </div>
        </article>`;
    }

    function render(nodes) {
      const online = nodes.filter(node => node.status === "online").length;
      totalCount.textContent = nodes.length;
      onlineCount.textContent = online;
      offlineCount.textContent = nodes.length - online;

      if (!nodes.length) {
        nodesElement.innerHTML = `
          <div class="empty">
            <strong>NO NODES REGISTERED</strong>
            等待 Sidecar UDP 心跳…
          </div>`;
        return;
      }
      nodesElement.innerHTML = nodes.map(renderNode).join("");
    }

    async function refresh() {
      if (refreshing) return;
      refreshing = true;
      try {
        const response = await fetch("/api/nodes", {cache: "no-store"});
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const nodes = await response.json();
        render(nodes);
        connectionElement.classList.remove("error");
        connectionElement.textContent =
          `API CONNECTED · ${new Date().toLocaleTimeString()}`;
      } catch (error) {
        connectionElement.classList.add("error");
        connectionElement.textContent = `API DEGRADED · ${error.message}`;
      } finally {
        refreshing = false;
      }
    }

    refresh();
    setInterval(refresh, 250);
  </script>
</body>
</html>
